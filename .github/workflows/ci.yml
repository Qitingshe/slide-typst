# CI 门禁：compile 零警告 / 计数 / API / links 全部硬闸；pages 在 ubuntu 走 warn 态是设计预期
# （ubuntu 经 apt 安装 fonts-noto-cjk 对齐字体，但包版本/度量与 macOS 仍有差异，且 mdls 不可用）。
name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
        with: { typst-version: "0.15.1" }
      - name: Install Noto Sans CJK SC
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Verify font family is resolvable
        run: typst fonts | grep "Noto Sans CJK SC"
      - run: python3 scripts/verify.py