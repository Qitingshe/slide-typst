# CI 门禁：compile 零警告 / 计数 / API / links 全部硬闸；pages 在 ubuntu 走 warn 态是设计预期
# （ubuntu 经 apt 安装 fonts-noto-cjk-extra 补齐 Thin..Black 全字重，但包版本/度量与 macOS 仍有差异，且 mdls 不可用）。
name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
        with: { typst-version: "0.15.1" }
      - name: Install Noto Sans CJK SC (all weights)
        # -extra depends on the base package; install both explicitly for clarity.
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
      # The deck uses weight "medium" (500); the base package ships Regular+Bold only,
      # so a missing -extra silently falls back and desyncs rendering from macOS.
      - name: Verify font family and weight coverage
        run: |
          typst fonts | grep -q "Noto Sans CJK SC"
          variants=$(typst fonts --variants | awk '/^Noto Sans CJK SC$/{f=1;next} f&&/^[^ ]/{exit} f')
          for w in 100 300 350 400 500 700 900; do
            echo "$variants" | grep -q "Weight: $w" || { echo "missing Weight: $w"; exit 1; }
          done
      - run: python3 scripts/verify.py