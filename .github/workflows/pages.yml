# Pages 部署：macOS runner（brew cask 安装 Noto Sans CJK SC）→ 编译 + 六项门禁（pages 走 strict
# 硬闸）→ main.pdf 上传 Pages 供预览/下载。需用户先在仓库 Settings > Pages 选择
# "GitHub Actions" 作为源（fire-and-forget：未开启时本工作流不运行，不阻塞 CI）。
name: Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
        with: { typst-version: "0.15.1" }
      - name: Install Noto Sans CJK SC
        run: brew install --cask font-noto-sans-cjk-sc
      - name: Verify font family and weight coverage
        run: |
          typst fonts | grep -q "Noto Sans CJK SC"
          variants=$(typst fonts --variants | awk '/^Noto Sans CJK SC$/{f=1;next} f&&/^[^ ]/{exit} f')
          for w in 100 300 350 400 500 700 900; do
            echo "$variants" | grep -q "Weight: $w" || { echo "missing Weight: $w"; exit 1; }
          done
      - name: Compile and verify gates (strict-pages on macOS)
        run: python3 scripts/verify.py --strict-pages
      - name: Stage PDF for Pages
        run: mkdir -p _site && cp main.pdf _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4